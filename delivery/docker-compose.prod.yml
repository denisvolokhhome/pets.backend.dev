# Production stack for breedly.us / api.breedly.us (prod-docker LXC, 192.168.68.114).
#
# Not started by hand: delivery/prod/deploy.sh drives it, called by the
# Jenkinsfile.prod pipelines of the backend and frontend repos.
#
# Two env files are passed on every compose call:
#   .env          secrets (POSTGRES_PASSWORD, SECRET_KEY, S3_ACCESS_KEY, S3_SECRET_KEY, SMTP_*, STRIPE_*, ...); lives only on the server
#   releases.env  image tags currently deployed (BACKEND_TAG, FRONTEND_TAG, ADMINISTRATION_TAG); written by deploy.sh
#
# Images are always pinned to an immutable tag (prod-<build>-<sha>), never :latest,
# so a rollback is just "put the previous tag back in releases.env and up -d".
#
# Public traffic arrives only through the Cloudflare tunnel (cloudflared on the host),
# so app ports are bound to 127.0.0.1 and postgres/redis are not published at all.
# Exception: the LAN-only administration portal is bound to the LAN address (192.168.68.114:8502).

name: breedly-prod

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://breedly_user:${POSTGRES_PASSWORD}@postgres:5432/breedly_db
  REDIS_URL: redis://redis:6379/0
  ENVIRONMENT: production
  DEBUG: "false"
  TESTING: "false"
  FRONTEND_URL: https://breedly.us
  ALLOWED_ORIGINS: https://breedly.us,https://www.breedly.us
  CLIENT_IP_HEADER: CF-Connecting-IP
  STORAGE_PATH: /app/storage
  STORAGE_URL: /storage
  EXPORT_PATH: /var/lib/breedly/exports   # private, NOT under STORAGE_PATH (which is served publicly)
  # Uploads live in RustFS (photos + private documents); STORAGE_PATH only holds pre-migration copies
  S3_ENDPOINT_URL: http://rustfs:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  # Feature flags: must match the frontend's environment.prod.ts
  ENABLE_SERVICE_PROVIDERS: "false"
  ENABLE_WAITLIST: "false"
  ENABLE_BILLING: "false"

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgis/postgis:15-3.3-alpine
    environment:
      POSTGRES_DB: breedly_db
      POSTGRES_USER: breedly_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breedly_user -d breedly_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Object storage (RustFS, S3-compatible). Internal only: no published ports, console off.
  rustfs:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # One-shot jobs. The "jobs" profile keeps them out of a plain `up -d`;
  # deploy.sh runs them explicitly with `compose run --rm` before switching the backend.
  migration:
    image: 192.168.68.110:80/breedly/breedly-backend:${BACKEND_TAG:-unset}
    profiles: ["jobs"]
    command: alembic upgrade head
    env_file: .env
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    image: 192.168.68.110:80/breedly/breedly-backend:${BACKEND_TAG:-unset}
    profiles: ["jobs"]
    command: sh -c "python db/seed_breeds.py && python scripts/seed_service_categories.py"
    env_file: .env
    environment:
      <<: *backend-env
      # `python scripts/x.py` puts scripts/ (not /app) on sys.path, so `import app` fails without this
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: 192.168.68.110:80/breedly/breedly-backend:${BACKEND_TAG:-unset}
    env_file: .env
    environment: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_storage:/app/storage
      - backend_exports:/var/lib/breedly/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    image: 192.168.68.110:80/breedly/breedly-frontend:${FRONTEND_TAG:-unset}
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Administration portal (repo breedly-administration). LAN only: bound to the host's LAN address,
  # never routed through the Cloudflare tunnel. Gets only the two values it needs, not the whole .env.
  administration:
    image: 192.168.68.110:80/breedly/breedly-administration:${ADMINISTRATION_TAG:-unset}
    ports:
      - "192.168.68.114:8502:8501"
    environment:
      API_BASE_URL: http://backend:8000
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ADMIN_PASSWORD: ${ADMINISTRATION_PASSWORD:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_storage:
  backend_exports:
  rustfs_data:
